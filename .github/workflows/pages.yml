name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Проверка HTML
        run: |
          python3 - <<'PY'
          import pathlib, sys
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          required = ['<html lang="ru"', 'name="viewport"', 'assets/styles.css', 'assets/app.js', '<main', '</html>']
          missing = [r for r in required if r not in html]
          if missing:
              sys.exit(f"В index.html не хватает: {missing}")
          for asset in ("assets/styles.css", "assets/app.js", "assets/favicon.svg"):
              if not pathlib.Path(asset).is_file():
                  sys.exit(f"Нет файла {asset}")
          print("HTML и ассеты на месте")
          PY

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
